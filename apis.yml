description: >-
  BankruptcyWatch is the proven creditor bankruptcy platform built with machine learning and intelligent automation to
  elevate every bankruptcy interaction. The PACER API provides access to US bankruptcy court data enabling creditors,
  lenders, and legal teams to search for cases, retrieve dockets, manage claims, file Proof of Claim documents, and
  automate bankruptcy monitoring across all federal bankruptcy court districts.
